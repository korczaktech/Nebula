[workspace]
resolver = "2"
members = [
    "compilador/fonte",
    "compilador/diagnosticos",
    "compilador/sintaxe",
    "compilador/semantica",
    "compilador/ir",
    "compilador/backend",
    "compilador/cli",
    "compilador/runtime",
    "biblioteca",
    "compilador/pacotes",
    "compilador/seguranca",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "LicenseRef-Korczak-Nebula-Use-Only"
repository = "https://github.com/korczaktech/Nebula"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
