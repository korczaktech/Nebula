name: Formatação temporária do Lexer

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  formatar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Formatar arquivos do Lexer
        run: rustfmt --edition 2024 compilador/sintaxe/src/lexer/token.rs compilador/sintaxe/src/lexer/scanner.rs compilador/sintaxe/src/lexer/testes.rs
      - name: Salvar formatação
        run: |
          if git diff --quiet -- compilador/sintaxe/src/lexer; then
            echo "Arquivos já formatados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compilador/sintaxe/src/lexer
          git commit -m "Formata Lexer Nebula"
          git push origin HEAD:main
