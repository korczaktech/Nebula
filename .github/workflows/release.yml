name: Preparar lançamento

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: Linux x86-64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Validar workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo doc --locked --workspace --no-deps

      - name: Compilar CLI
        run: cargo build --locked --release -p nebula-cli

      - name: Preparar artefato e checksum
        run: |
          mkdir -p dist
          install -m 0755 target/release/nebula dist/nebula-linux-x86_64
          printf '%s\n' "Linux x86-64 / ELF64" > dist/PLATAFORMA.txt
          cd dist
          sha256sum nebula-linux-x86_64 PLATAFORMA.txt > SHA256SUMS

      - name: Publicar artefatos
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nebula-linux-x86_64
            dist/PLATAFORMA.txt
            dist/SHA256SUMS
          fail_on_unmatched_files: true
