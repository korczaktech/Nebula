name: Preparar lançamento

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  linux-x86_64:
    name: Linux x86-64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Bloquear distribuição sem licença aprovada
        run: |
          test -s LICENSE
          grep -q 'Status: APROVADA PARA DISTRIBUIÇÃO' LICENSE-STATUS.md

      - name: Validar workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo doc --locked --workspace --no-deps

      - name: Compilar ferramentas
        run: cargo build --locked --release -p nebula-cli

      - name: Preparar artefatos e checksums
        run: |
          mkdir -p dist
          install -m 0755 target/release/nebula dist/nebula-linux-x86_64
          install -m 0755 target/release/nebula-formatar dist/nebula-formatar-linux-x86_64
          printf '%s\n' "Linux x86-64 / ELF64" > dist/PLATAFORMA.txt
          cd dist
          sha256sum nebula-linux-x86_64 nebula-formatar-linux-x86_64 PLATAFORMA.txt > SHA256SUMS

      - name: Gerar atestação assinada de proveniência
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/nebula-linux-x86_64
            dist/nebula-formatar-linux-x86_64
            dist/PLATAFORMA.txt
            dist/SHA256SUMS

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/nebula-linux-x86_64 \
            dist/nebula-formatar-linux-x86_64 \
            dist/PLATAFORMA.txt \
            dist/SHA256SUMS \
            --generate-notes
