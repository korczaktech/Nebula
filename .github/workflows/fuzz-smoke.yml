name: Fuzz smoke

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  entradas-adversariais:
    name: Lexer, Parser, JSON e pacotes com entradas adversariais
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter código
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@1.120.0
      - name: Lexer e Parser
        run: cargo test --locked -p nebula-sintaxe lexer_e_parser_resistem_a_entradas_malformadas_deterministicas -- --nocapture
      - name: Parser JSON
        run: cargo test --locked -p nebula-biblioteca json_parser_resiste_a_entradas_adversariais_deterministicas -- --nocapture
      - name: Manifestos e pacotes
        run: cargo test --locked -p nebula-pacotes manifestos_resistem_a_entradas_adversariais_deterministicas -- --nocapture
