name: Formatar temporariamente
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/format-semantic-temp.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Formatar workspace
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "Formatar codigo Rust"
            git push
          fi
